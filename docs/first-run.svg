<svg xmlns="http://www.w3.org/2000/svg" width="939" height="158" viewBox="0 0 939 158" role="img" aria-label="The notice shown the first time the plugin runs: what it does on its own and where to change it"><title>The notice shown the first time the plugin runs: what it does on its own and where to change it</title><rect width="939" height="158" rx="8" fill="#0c0c0c"/><g font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14"><text x="16.0" y="30" fill="#3aa3b3" font-weight="bold" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">h</text><circle cx="26.9" cy="19.4" r="1.25" fill="#7ad8f8"/><circle cx="26.9" cy="23.0" r="1.25" fill="#7ad8f8"/><circle cx="26.9" cy="26.6" r="1.25" fill="#7ad8f8"/><circle cx="26.9" cy="30.2" r="1.25" fill="#7ad8f8"/><circle cx="30.4" cy="19.4" r="1.25" fill="#7ad8f8"/><circle cx="30.4" cy="23.0" r="1.25" fill="#7ad8f8"/><circle cx="30.4" cy="26.6" r="1.25" fill="#7ad8f8"/><circle cx="30.4" cy="30.2" r="1.25" fill="#7ad8f8"/><text x="32.8" y="30" fill="#f2f2f2" font-weight="bold" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Cache Bell:</text><text x="133.6" y="30" fill="#f2f2f2" font-weight="bold" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> while you are away this plugin acts on its own, on your plan</text><text x="16.0" y="51" fill="#cccccc" textLength="890.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  before the prompt cache expires it renews the prompt cache up to 2 times, then compacts the conversation</text><text x="16.0" y="72" fill="#cccccc" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Claude may ask for a compaction too: you get 30 s to cancel, or the time Claude names</text><text x="16.0" y="93" fill="#767676" textLength="621.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  this notice is shown once: OK or your next message puts it away for good</text><text x="16.0" y="114" fill="#cccccc" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  </text><text x="32.8" y="114" fill="#f2f2f2" font-weight="bold" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ OK ]</text><text x="83.2" y="114" fill="#767676" textLength="722.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  change it in /config: cache-bell.mode, cache-bell.sessionCompact, cache-bell.enabled</text><line x1="16" y1="127" x2="923" y2="127" stroke="#3a3a3a" stroke-width="1"/><text x="16.0" y="145" fill="#767676" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; </text></g></svg>
